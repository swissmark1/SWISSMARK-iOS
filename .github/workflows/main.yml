name: Build SWISSMARK iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:

      # 1. تحميل المشروع
      - name: Checkout
        uses: actions/checkout@v4


      # 2. تثبيت Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable


      # 3. فك ملف المشروع
      - name: Extract SWISSMARK project
        run: |
          echo "=============================="
          echo "EXTRACTING SWISSMARK PROJECT"
          echo "=============================="

          unzip -o SWISSMARK_GITHUB_READY_FIXED.zip

          echo ""
          echo "=== Repository files ==="
          ls -la

          echo ""
          echo "=== Project folder ==="
          ls -la SWISSMARK_GITHUB_READY


      # 4. إنشاء iOS من جديد
      - name: Prepare Flutter iOS project
        run: |
          cd SWISSMARK_GITHUB_READY

          echo "=============================="
          echo "FLUTTER VERSION"
          echo "=============================="
          flutter --version

          echo ""
          echo "=============================="
          echo "REMOVE OLD IOS"
          echo "=============================="

          rm -rf ios

          echo ""
          echo "=============================="
          echo "CREATE FRESH IOS PROJECT"
          echo "=============================="

          flutter create \
            --platforms=ios \
            --org com.swissmark \
            .

          echo ""
          echo "=============================="
          echo "IOS FILES"
          echo "=============================="

          ls -la ios


      # 5. جلب مكتبات Flutter
      - name: Get Flutter packages
        run: |
          cd SWISSMARK_GITHUB_READY

          echo "=============================="
          echo "FLUTTER PUB GET"
          echo "=============================="

          flutter pub get

          echo ""
          echo "=============================="
          echo "CHECK PODFILE"
          echo "=============================="

          if [ -f "ios/Podfile" ]; then
            echo "Podfile FOUND"
          else
            echo "Podfile NOT FOUND"
            echo "This is allowed if the project has no CocoaPods plugins."
          fi


      # 6. تثبيت CocoaPods فقط إذا كان Podfile موجود
      - name: Prepare iOS dependencies
        run: |
          cd SWISSMARK_GITHUB_READY

          echo "=============================="
          echo "IOS DEPENDENCIES"
          echo "=============================="

          if [ -f "ios/Podfile" ]; then

            echo "Podfile exists."
            echo "Installing CocoaPods..."

            cd ios

            pod install --repo-update

            echo ""
            echo "CocoaPods installation completed."

          else

            echo "No Podfile."
            echo "Skipping CocoaPods."

          fi


      # 7. بناء تطبيق iOS بدون توقيع
      - name: Build iOS without signing
        run: |
          cd SWISSMARK_GITHUB_READY

          echo "=============================="
          echo "BUILD IOS"
          echo "=============================="

          flutter build ios \
            --release \
            --no-codesign


      # 8. التأكد من وجود Runner.app
      - name: Verify iOS app
        run: |
          cd SWISSMARK_GITHUB_READY

          echo "=============================="
          echo "VERIFY IOS APP"
          echo "=============================="

          if [ -d "build/ios/iphoneos/Runner.app" ]; then

            echo ""
            echo "================================"
            echo "RUNNER.APP CREATED SUCCESSFULLY"
            echo "================================"

            ls -lh build/ios/iphoneos/Runner.app

          else

            echo ""
            echo "================================"
            echo "ERROR: RUNNER.APP NOT FOUND"
            echo "================================"

            echo ""
            echo "=== Build directory ==="
            find build -maxdepth 4 -type d 2>/dev/null || true

            exit 1

          fi


      # 9. إنشاء IPA بدون توقيع
      - name: Create unsigned IPA
        run: |
          cd SWISSMARK_GITHUB_READY

          echo "=============================="
          echo "CREATE IPA"
          echo "=============================="

          rm -rf Payload
          rm -f SWISSMARK.ipa

          mkdir -p Payload

          cp -R \
            build/ios/iphoneos/Runner.app \
            Payload/SWISSMARK.app

          echo ""
          echo "Creating IPA..."

          zip -r -q SWISSMARK.ipa Payload

          echo ""
          echo "================================"
          echo "SWISSMARK IPA CREATED"
          echo "================================"

          ls -lh SWISSMARK.ipa


      # 10. رفع IPA كـ Artifact
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SWISSMARK-IPA
          path: SWISSMARK_GITHUB_READY/SWISSMARK.ipa
          if-no-files-found: error
