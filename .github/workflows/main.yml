name: Build SWISSMARK iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract V14 project
        shell: bash
        run: |
          set -e

          ZIP_FILE="SWISSMARK_iOS_SOURCE_PORT_V14.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found"
            exit 1
          fi

          rm -rf SWISSMARKiOS
          rm -f project.yml

          unzip -o "$ZIP_FILE" -d .

          echo "=== Project files ==="
          ls -la
          echo "=== iOS source ==="
          find SWISSMARKiOS -maxdepth 2 -type f | sort

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate

      - name: Build iOS app
        shell: bash
        run: |
          set -o pipefail

          xcodebuild \
            -project SWISSMARKiOS.xcodeproj \
            -scheme SWISSMARKiOS \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | tee build.log

      - name: Verify app
        run: |
          APP_PATH=$(find build -type d -name "SWISSMARKiOS.app" | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: SWISSMARKiOS.app not found"
            exit 1
          fi

          echo "APP FOUND:"
          echo "$APP_PATH"

          file "$APP_PATH/SWISSMARKiOS"

      - name: Create IPA
        run: |
          APP_PATH=$(find build -type d -name "SWISSMARKiOS.app" | head -1)

          rm -rf Payload
          mkdir Payload

          cp -R "$APP_PATH" Payload/SWISSMARKiOS.app

          zip -r SWISSMARK-iOS.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SWISSMARK-iOS
          path: SWISSMARK-iOS.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SWISSMARK-build-log
          path: build.log
          if-no-files-found: ignore
