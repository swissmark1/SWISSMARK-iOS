name: Build SWISSMARK iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract SWISSMARK project
        run: |
          unzip -o SWISSMARK_GITHUB_READY.zip

      - name: Prepare Flutter iOS project
        run: |
          cd SWISSMARK_GITHUB_READY
          rm -rf ios
          flutter create --platforms=ios .

      - name: Get Flutter packages
        run: |
          cd SWISSMARK_GITHUB_READY
          flutter pub get

      - name: Verify iOS project
        run: |
          cd SWISSMARK_GITHUB_READY

          test -f ios/Runner.xcodeproj/project.pbxproj
          test -f ios/Runner.xcworkspace/contents.xcworkspacedata

          echo "======================================"
          echo "iOS project verification successful"
          echo "======================================"

      - name: Build iOS without signing
        run: |
          cd SWISSMARK_GITHUB_READY

          rm -rf build/ios/xcodebuild
          rm -f xcodebuild.log

          set +e

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/xcodebuild \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build > xcodebuild.log 2>&1

          BUILD_STATUS=$?

          echo ""
          echo "======================================"
          echo "SWISSMARK BUILD ERROR"
          echo "======================================"

          grep -nEi \
            "error:|fatal error:|PhaseScriptExecution|Command.*failed|No such file|not found|failed" \
            xcodebuild.log | tail -80 || true

          echo ""
          echo "======================================"
          echo "END ERROR"
          echo "======================================"

          exit $BUILD_STATUS

      - name: Create unsigned IPA
        if: success()
        run: |
          cd SWISSMARK_GITHUB_READY

          rm -rf Payload
          mkdir Payload

          cp -R \
            build/ios/xcodebuild/Build/Products/Release-iphoneos/Runner.app \
            Payload/SWISSMARK.app

          cd Payload
          zip -r ../SWISSMARK.ipa SWISSMARK.app

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SWISSMARK-IPA
          path: SWISSMARK_GITHUB_READY/SWISSMARK.ipa
          if-no-files-found: error
