name: Build SWISSMARK iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build SWISSMARK iOS
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check iOS source
        shell: bash
        run: |
          set -euo pipefail

          test -f project.yml
          test -d SWISSMARKiOS
          test -f SWISSMARKiOS/SWISSMARKiOSApp.swift
          test -f SWISSMARKiOS/Info.plist

          echo "iOS source found:"
          find SWISSMARKiOS -maxdepth 2 -type f -print

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          test -d SWISSMARKiOS.xcodeproj

      - name: Show Xcode information
        run: |
          xcodebuild -version
          xcodegen --version

      - name: Clean
        run: |
          xcodebuild clean \
            -project SWISSMARKiOS.xcodeproj \
            -scheme SWISSMARKiOS \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build iOS app
        shell: bash
        run: |
          set -o pipefail

          rm -rf build

          xcodebuild \
            -project SWISSMARKiOS.xcodeproj \
            -scheme SWISSMARKiOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build | tee build.log

      - name: Verify app
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(find build -type d -name '*.app' -print -quit)"

          test -n "$APP_PATH"
          test -f "$APP_PATH/SWISSMARKiOS"

          echo "APP: $APP_PATH"
          du -sh "$APP_PATH"
          file "$APP_PATH/SWISSMARKiOS"

      - name: Create IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(find build -type d -name '*.app' -print -quit)"

          rm -rf Payload SWISSMARK-iOS.ipa
          mkdir -p Payload

          cp -R "$APP_PATH" Payload/

          zip -qry SWISSMARK-iOS.ipa Payload

          ls -lh SWISSMARK-iOS.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SWISSMARK-iOS
          path: SWISSMARK-iOS.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SWISSMARK-build-log
          path: build.log
          if-no-files-found: ignore
