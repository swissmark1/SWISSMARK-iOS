name: Build SWISSMARK iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract SWISSMARK project
        run: |
          unzip -o SWISSMARK_GITHUB_READY_FIXED.zip
          echo "=== Extracted files ==="
          ls -la

      - name: Prepare Flutter iOS project
        run: |
          cd SWISSMARK_GITHUB_READY

          echo "=== Flutter version ==="
          flutter --version

          echo "=== Removing old iOS folder ==="
          rm -rf ios

          echo "=== Creating fresh iOS project ==="
          flutter create \
            --platforms=ios \
            --org com.swissmark \
            .

          echo "=== Checking iOS folder ==="
          ls -la ios

          echo "=== Checking Podfile ==="
          if [ ! -f "ios/Podfile" ]; then
            echo "ERROR: Podfile was NOT created"
            exit 1
          fi

          echo "Podfile exists successfully"

      - name: Get Flutter packages
        run: |
          cd SWISSMARK_GITHUB_READY
          flutter pub get

      - name: Prepare iOS dependencies
        run: |
          cd SWISSMARK_GITHUB_READY/ios

          echo "=== Installing CocoaPods ==="
          pod install --repo-update

          echo "=== Pods installed ==="
          ls -la

      - name: Build iOS without signing
        run: |
          cd SWISSMARK_GITHUB_READY

          flutter build ios \
            --release \
            --no-codesign

      - name: Disable signing and build archive
        run: |
          cd SWISSMARK_GITHUB_READY

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Verify iOS app
        run: |
          cd SWISSMARK_GITHUB_READY

          echo "=== Checking Runner.app ==="

          if [ ! -d "build/ios/iphoneos/Runner.app" ]; then
            echo "ERROR: Runner.app was not created"
            exit 1
          fi

          echo "Runner.app exists!"
          ls -lh build/ios/iphoneos/Runner.app

      - name: Create unsigned IPA
        run: |
          cd SWISSMARK_GITHUB_READY

          echo "=== Creating IPA ==="

          rm -rf Payload
          mkdir -p Payload

          cp -R \
            build/ios/iphoneos/Runner.app \
            Payload/SWISSMARK.app

          zip -r SWISSMARK.ipa Payload

          echo "=============================="
          echo "SWISSMARK IPA CREATED"
          echo "=============================="

          ls -lh SWISSMARK.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SWISSMARK-IPA
          path: SWISSMARK_GITHUB_READY/SWISSMARK.ipa
          if-no-files-found: error
