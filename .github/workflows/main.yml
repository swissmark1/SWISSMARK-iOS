name: Build SWISSMARK iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter 3.47.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Extract SWISSMARK project
        shell: bash
        run: |
          set -euo pipefail

          echo "=== FINDING SWISSMARK ZIP ==="

          shopt -s nullglob

          zips=(SWISSMARK_V51_IOS*.zip)

          if [ "${#zips[@]}" -eq 0 ]; then
            echo "ERROR: No SWISSMARK_V51_IOS*.zip found."
            echo "Files in repository:"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "Using ZIP: ${zips[0]}"

          rm -rf swissmark_project
          mkdir -p swissmark_project

          unzip -q "${zips[0]}" -d swissmark_project

          PROJECT_DIR="$(
            find swissmark_project \
              -name pubspec.yaml \
              -type f \
              -print \
              -quit |
              xargs -r dirname
          )"

          if [ -z "${PROJECT_DIR}" ]; then
            echo "ERROR: pubspec.yaml was not found."
            find swissmark_project -maxdepth 5 -print
            exit 1
          fi

          echo "PROJECT_DIR=${PROJECT_DIR}" >> "$GITHUB_ENV"

          echo "Flutter project:"
          echo "${PROJECT_DIR}"

          test -f "${PROJECT_DIR}/pubspec.yaml"
          test -f "${PROJECT_DIR}/lib/main.dart"

          echo "Project files verified."

      - name: Verify Flutter project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          flutter --version

          flutter pub get

          flutter analyze --no-fatal-infos

      - name: Create iOS project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          flutter create --platforms=ios .

      - name: Get Flutter packages
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          flutter pub get

      - name: Configure iOS permissions
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          p = Path("ios/Runner/Info.plist")

          s = p.read_text()

          additions = [
              (
                  "<key>NSLocationWhenInUseUsageDescription</key>",
                  "<key>NSLocationWhenInUseUsageDescription</key>"
                  "<string>SWISSMARK يحتاج الموقع لعرض موقع الزبون.</string>"
              ),
              (
                  "<key>NSPhotoLibraryUsageDescription</key>",
                  "<key>NSPhotoLibraryUsageDescription</key>"
                  "<string>SWISSMARK يحتاج الصور لإرفاقها بالأوردرات.</string>"
              ),
              (
                  "<key>NSCameraUsageDescription</key>",
                  "<key>NSCameraUsageDescription</key>"
                  "<string>SWISSMARK يحتاج الكاميرا لإضافة صور للأوردر.</string>"
              ),
          ]

          for key, block in additions:
              if key not in s:
                  s = s.replace(
                      "</dict>",
                      "    " + block + "\n</dict>",
                      1
                  )

          p.write_text(s)

          print("iOS permissions configured.")

      - name: Generate iOS configuration without signing
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          flutter build ios \
            --release \
            --no-codesign

      - name: Verify iOS app
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          test -d build/ios/iphoneos/Runner.app

          echo "Runner.app exists."

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            build/ios/iphoneos/Runner.app/Info.plist

      - name: Create IPA
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          rm -rf ipa_out

          mkdir -p ipa_out/Payload

          cp -R \
            build/ios/iphoneos/Runner.app \
            ipa_out/Payload/SWISSMARK.app

          cd ipa_out

          zip -qr ../SWISSMARK.ipa Payload

          test -f ../SWISSMARK.ipa

          echo "IPA CREATED SUCCESSFULLY."

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SWISSMARK-iOS-IPA
          path: ${{ env.PROJECT_DIR }}/SWISSMARK.ipa
          if-no-files-found: error
