name: Build SWISSMARK iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract SWISSMARK project
        run: |
          unzip -o SWISSMARK_GITHUB_READY_FIXED.zip
          echo "Project extracted"
          ls -la

      - name: Prepare Flutter iOS project
        run: |
          cd SWISSMARK_GITHUB_READY
          flutter create --platforms=ios .
          echo "iOS project prepared"

      - name: Get Flutter packages
        run: |
          cd SWISSMARK_GITHUB_READY
          flutter pub get

      - name: Prepare iOS dependencies
        run: |
          cd SWISSMARK_GITHUB_READY
          flutter precache --ios
          cd ios
          pod install
          echo "Pods installed successfully"

      - name: Disable iOS signing
        run: |
          cd SWISSMARK_GITHUB_READY

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Verify iOS app
        run: |
          cd SWISSMARK_GITHUB_READY

          if [ ! -d "build/ios/iphoneos/Runner.app" ]; then
            echo "ERROR: Runner.app was not created"
            exit 1
          fi

          echo "Runner.app created successfully"
          ls -lh build/ios/iphoneos/Runner.app

      - name: Create unsigned IPA
        run: |
          cd SWISSMARK_GITHUB_READY

          rm -rf Payload
          mkdir Payload

          cp -R build/ios/iphoneos/Runner.app Payload/SWISSMARK.app

          zip -r SWISSMARK.ipa Payload

          echo "SWISSMARK IPA CREATED"
          ls -lh SWISSMARK.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SWISSMARK-IPA
          path: SWISSMARK_GITHUB_READY/SWISSMARK.ipa
          if-no-files-found: error
