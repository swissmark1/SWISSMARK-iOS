name: Build SWISSMARK iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Flutter 3.47.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true


      - name: Extract SWISSMARK project
        shell: bash
        run: |
          set -euo pipefail

          unzip -q -o SWISSMARK_GITHUB_READY_FIXED.zip

          test -f SWISSMARK_GITHUB_READY/pubspec.yaml
          test -f SWISSMARK_GITHUB_READY/lib/main.dart

          echo "SWISSMARK project found."


      - name: Create iOS project
        shell: bash
        run: |
          set -euo pipefail

          cd SWISSMARK_GITHUB_READY

          rm -rf ios

          flutter config --enable-swift-package-manager

          flutter create \
            --platforms=ios \
            --org com.swissmark \
            --project-name swissmark \
            .

          test -f ios/Runner.xcodeproj/project.pbxproj
          test -f ios/Runner.xcworkspace/contents.xcworkspacedata

          echo "iOS project created successfully."


      - name: Get Flutter packages
        shell: bash
        run: |
          set -euo pipefail

          cd SWISSMARK_GITHUB_READY

          flutter clean
          flutter pub get

          test -f ios/Flutter/Generated.xcconfig

          echo "Flutter packages resolved successfully."


      - name: Configure iOS permissions
        shell: bash
        run: |
          set -euo pipefail

          cd SWISSMARK_GITHUB_READY

          PLIST="ios/Runner/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Add :NSLocationWhenInUseUsageDescription string SWISS MARK needs your location to save the customer location." \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string SWISS MARK needs your location to save the customer location." \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :NSPhotoLibraryUsageDescription string SWISS MARK needs photo access to attach photos to maintenance orders." \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :NSCameraUsageDescription string SWISS MARK needs camera access to attach photos to maintenance orders." \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :NSMicrophoneUsageDescription string SWISS MARK needs microphone access when recording order videos." \
            "$PLIST" 2>/dev/null || true

          echo "iOS permissions configured."


      - name: Generate iOS configuration without signing
        shell: bash
        run: |
          set -euo pipefail

          cd SWISSMARK_GITHUB_READY

          flutter build ios \
            --release \
            --config-only \
            --no-codesign

          echo "iOS configuration generated successfully."


      - name: Build iOS with Xcode without signing
        shell: bash
        run: |
          set -euo pipefail

          cd SWISSMARK_GITHUB_READY

          mkdir -p build/xcode

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/xcode \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

          echo "Xcode build completed successfully."


      - name: Create IPA
        shell: bash
        run: |
          set -euo pipefail

          cd SWISSMARK_GITHUB_READY

          APP_PATH="build/xcode/Build/Products/Release-iphoneos/Runner.app"

          test -d "$APP_PATH"

          rm -rf Payload
          rm -f SWISSMARK.ipa

          mkdir Payload

          cp -R \
            "$APP_PATH" \
            Payload/SWISSMARK.app

          /usr/bin/zip \
            -q \
            -r \
            SWISSMARK.ipa \
            Payload/SWISSMARK.app

          test -s SWISSMARK.ipa

          unzip -tq SWISSMARK.ipa

          echo ""
          echo "======================================"
          echo "SWISSMARK IPA CREATED SUCCESSFULLY"
          echo "======================================"

          ls -lh SWISSMARK.ipa


      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SWISSMARK-IPA
          path: SWISSMARK_GITHUB_READY/SWISSMARK.ipa
          if-no-files-found: error
      - name: Build Flutter bundle
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "BUILD FLUTTER BUNDLE"
          echo "======================================"

          flutter build bundle --release

          echo ""
          echo "Flutter bundle created successfully."


      - name: Build iOS with Xcode without signing
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "XCODE BUILD WITHOUT SIGNING"
          echo "======================================"

          xcodebuild \
            -project ios/Runner.xcodeproj \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/xcode \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            build

          echo ""
          echo "======================================"
          echo "XCODE BUILD SUCCESSFUL"
          echo "======================================"


      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "CREATE IPA"
          echo "======================================"

          APP_PATH="build/xcode/Build/Products/Release-iphoneos/Runner.app"

          test -d "$APP_PATH"

          rm -rf Payload
          rm -f SWISSMARK.ipa

          mkdir Payload

          cp -R \
            "$APP_PATH" \
            Payload/SWISSMARK.app

          cd Payload

          /usr/bin/zip \
            -r \
            -q \
            ../SWISSMARK.ipa \
            SWISSMARK.app

          cd ..

          test -s SWISSMARK.ipa

          echo ""
          echo "======================================"
          echo "VERIFY IPA"
          echo "======================================"

          unzip -tq SWISSMARK.ipa

          echo ""
          echo "IPA CREATED SUCCESSFULLY:"
          ls -lh SWISSMARK.ipa


      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SWISSMARK-IPA
          path: SWISSMARK.ipa
          if-no-files-found: error
