name: Build SWISSMARK iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # 2. Setup Flutter
      # =========================================================
      - name: Setup Flutter 3.47.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true


      # =========================================================
      # 3. Extract SWISSMARK project
      # =========================================================
      - name: Extract SWISSMARK project
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "EXTRACT SWISSMARK PROJECT"
          echo "========================================"

          test -f "SWISSMARK_GITHUB_READY_FIXED.zip"

          unzip -q -o "SWISSMARK_GITHUB_READY_FIXED.zip"

          echo ""
          echo "Searching for pubspec.yaml..."

          PUBSPEC=$(find . \
            -type f \
            -name "pubspec.yaml" \
            -not -path "./.git/*" \
            -print \
            | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo ""
            echo "ERROR: pubspec.yaml was not found."
            echo ""
            echo "Extracted files:"
            find . -maxdepth 3 -type f | head -n 200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo ""
          echo "========================================"
          echo "FLUTTER PROJECT FOUND"
          echo "========================================"

          echo "PUBSPEC:"
          echo "$PUBSPEC"

          echo ""
          echo "PROJECT DIRECTORY:"
          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Project files:"
          ls -la "$PROJECT_DIR"


      # =========================================================
      # 4. Verify Flutter project
      # =========================================================
      - name: Verify Flutter project
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFY FLUTTER PROJECT"
          echo "========================================"

          test -d "$PROJECT_DIR"
          test -f "$PROJECT_DIR/pubspec.yaml"
          test -f "$PROJECT_DIR/lib/main.dart"

          echo "Flutter project is valid."

          echo ""
          echo "Flutter version:"
          flutter --version


      # =========================================================
      # 5. Create fresh iOS project
      # =========================================================
      - name: Create iOS project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "CREATE FRESH IOS PROJECT"
          echo "========================================"

          rm -rf ios

          flutter config --enable-swift-package-manager

          flutter create \
            --platforms=ios \
            --org com.swissmark \
            --project-name swissmark \
            .

          test -d ios
          test -f ios/Runner.xcodeproj/project.pbxproj
          test -f ios/Runner.xcworkspace/contents.xcworkspacedata

          echo ""
          echo "iOS project created successfully."


      # =========================================================
      # 6. Get Flutter packages
      # =========================================================
      - name: Get Flutter packages
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "FLUTTER PUB GET"
          echo "========================================"

          flutter clean
          flutter pub get

          test -f pubspec.yaml
          test -f ios/Flutter/Generated.xcconfig

          echo ""
          echo "Flutter packages resolved successfully."


      # =========================================================
      # 7. Configure iOS permissions
      # =========================================================
      - name: Configure iOS permissions
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          PLIST="ios/Runner/Info.plist"

          echo "========================================"
          echo "CONFIGURE IOS PERMISSIONS"
          echo "========================================"

          /usr/libexec/PlistBuddy \
            -c "Add :NSLocationWhenInUseUsageDescription string SWISS MARK needs your location to save the customer location." \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string SWISS MARK needs your location to save the customer location." \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :NSPhotoLibraryUsageDescription string SWISS MARK needs photo access to attach photos to maintenance orders." \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :NSCameraUsageDescription string SWISS MARK needs camera access to attach photos to maintenance orders." \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :NSMicrophoneUsageDescription string SWISS MARK needs microphone access when recording order videos." \
            "$PLIST" 2>/dev/null || true

          echo "iOS permissions configured."


      # =========================================================
      # 8. Generate iOS configuration
      # =========================================================
      - name: Generate iOS configuration without signing
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "GENERATE IOS CONFIGURATION"
          echo "========================================"

          flutter build ios \
            --release \
            --config-only \
            --no-codesign

          echo ""
          echo "iOS configuration generated successfully."


      # =========================================================
      # 9. Build Flutter bundle
      # =========================================================
      - name: Build Flutter bundle
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "BUILD FLUTTER BUNDLE"
          echo "========================================"

          test -f pubspec.yaml

          flutter build bundle --release

          echo ""
          echo "Flutter bundle created successfully."


      # =========================================================
      # 10. Build iOS with Xcode WITHOUT SIGNING
      # =========================================================
      - name: Build iOS with Xcode without signing
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "BUILD IOS WITH XCODE"
          echo "========================================"

          mkdir -p build/xcode

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/xcode \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

          echo ""
          echo "========================================"
          echo "XCODE BUILD FINISHED"
          echo "========================================"


      # =========================================================
      # 11. Verify Runner.app
      # =========================================================
      - name: Verify iOS app
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "VERIFY RUNNER.APP"
          echo "========================================"

          APP_PATH="build/xcode/Build/Products/Release-iphoneos/Runner.app"

          if [ ! -d "$APP_PATH" ]; then
            echo ""
            echo "ERROR: Runner.app was not found."
            echo ""
            echo "Searching build directory..."
            find build/xcode \
              -type d \
              -name "Runner.app" \
              -print \
              2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "Runner.app FOUND:"
          echo "$APP_PATH"

          echo "$APP_PATH" > /tmp/swissmark_app_path


      # =========================================================
      # 12. Create IPA
      # =========================================================
      - name: Create IPA
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "CREATE SWISSMARK IPA"
          echo "========================================"

          APP_PATH=$(cat /tmp/swissmark_app_path)

          test -d "$APP_PATH"

          rm -rf Payload
          rm -f SWISSMARK.ipa

          mkdir -p Payload

          cp -R \
            "$APP_PATH" \
            Payload/SWISSMARK.app

          cd Payload

          /usr/bin/zip \
            -q \
            -r \
            ../SWISSMARK.ipa \
            SWISSMARK.app

          cd ..

          test -s SWISSMARK.ipa

          echo ""
          echo "========================================"
          echo "VERIFY IPA"
          echo "========================================"

          unzip -tq SWISSMARK.ipa

          echo ""
          echo "========================================"
          echo "SWISSMARK IPA CREATED"
          echo "========================================"

          ls -lh SWISSMARK.ipa


      # =========================================================
      # 13. Upload IPA
      # =========================================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SWISSMARK-IPA
          path: ${{ env.PROJECT_DIR }}/SWISSMARK.ipa
          if-no-files-found: error
