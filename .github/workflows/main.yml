name: Build SWISSMARK iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # 2. Setup Flutter
      # =========================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # =========================================================
      # 3. Extract SWISSMARK
      # =========================================================
      - name: Extract SWISSMARK project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "EXTRACTING SWISSMARK"
          echo "======================================"

          unzip -o SWISSMARK_GITHUB_READY_FIXED.zip

          cd SWISSMARK_GITHUB_READY

          echo ""
          echo "Project files:"
          ls -la


      # =========================================================
      # 4. Create fresh iOS host project
      # =========================================================
      - name: Create iOS host project
        shell: bash
        run: |
          set -e

          cd SWISSMARK_GITHUB_READY

          echo "======================================"
          echo "FLUTTER VERSION"
          echo "======================================"

          flutter --version

          echo ""
          echo "======================================"
          echo "REMOVE OLD IOS FOLDER"
          echo "======================================"

          rm -rf ios

          echo ""
          echo "======================================"
          echo "CREATE IOS HOST PROJECT"
          echo "======================================"

          flutter create \
            --platforms=ios \
            --org com.swissmark \
            --project-name swissmark \
            .

          echo ""
          echo "iOS project created."

          test -d ios
          test -f ios/Runner.xcodeproj/project.pbxproj

          echo ""
          echo "iOS files:"
          ls -la ios


      # =========================================================
      # 5. Get Flutter packages
      # =========================================================
      - name: Get Flutter packages
        shell: bash
        run: |
          set -e

          cd SWISSMARK_GITHUB_READY

          echo "======================================"
          echo "FLUTTER PUB GET"
          echo "======================================"

          flutter pub get

          echo ""
          echo "Pub get completed."

          echo ""
          echo "Checking CocoaPods Podfile..."

          if [ ! -f ios/Podfile ]; then
            echo ""
            echo "ERROR: ios/Podfile was not generated."
            echo ""
            echo "Flutter package dependencies:"
            cat pubspec.yaml
            exit 1
          fi

          echo ""
          echo "Podfile FOUND."


      # =========================================================
      # 6. Install CocoaPods
      # =========================================================
      - name: Install CocoaPods dependencies
        shell: bash
        run: |
          set -e

          cd SWISSMARK_GITHUB_READY

          echo "======================================"
          echo "COCOAPODS"
          echo "======================================"

          cd ios

          pod install --repo-update

          echo ""
          echo "CocoaPods completed."

          test -d Pods
          test -f Runner.xcworkspace/contents.xcworkspacedata

          echo ""
          echo "Runner.xcworkspace FOUND."


      # =========================================================
      # 7. Build Flutter assets/bundle only
      # =========================================================
      - name: Build Flutter release bundle
        shell: bash
        run: |
          set -e

          cd SWISSMARK_GITHUB_READY

          echo "======================================"
          echo "BUILD FLUTTER RELEASE BUNDLE"
          echo "======================================"

          flutter build bundle --release

          echo ""
          echo "Flutter release bundle created."


      # =========================================================
      # 8. Build iOS directly with Xcode
      #    NO APPLE SIGNING
      # =========================================================
      - name: Build iOS with Xcode unsigned
        shell: bash
        run: |
          set -e

          cd SWISSMARK_GITHUB_READY

          echo "======================================"
          echo "XCODE UNSIGNED BUILD"
          echo "======================================"

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/xcode \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

          echo ""
          echo "======================================"
          echo "XCODE BUILD COMPLETED"
          echo "======================================"


      # =========================================================
      # 9. Find Runner.app
      # =========================================================
      - name: Find Runner app
        shell: bash
        run: |
          set -e

          cd SWISSMARK_GITHUB_READY

          echo "======================================"
          echo "SEARCHING FOR RUNNER.APP"
          echo "======================================"

          APP_PATH=$(find build/xcode -type d -name "Runner.app" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo ""
            echo "ERROR: Runner.app was not created."
            echo ""
            echo "Available build products:"
            find build/xcode -maxdepth 6 -type d 2>/dev/null || true
            exit 1
          fi

          echo ""
          echo "RUNNER.APP FOUND:"
          echo "$APP_PATH"

          echo "$APP_PATH" > /tmp/swissmark_app_path


      # =========================================================
      # 10. Create IPA
      # =========================================================
      - name: Create unsigned IPA
        shell: bash
        run: |
          set -e

          cd SWISSMARK_GITHUB_READY

          echo "======================================"
          echo "CREATE SWISSMARK IPA"
          echo "======================================"

          APP_PATH=$(cat /tmp/swissmark_app_path)

          echo ""
          echo "App:"
          echo "$APP_PATH"

          rm -rf Payload
          rm -f SWISSMARK.ipa

          mkdir -p Payload

          cp -R "$APP_PATH" Payload/SWISSMARK.app

          echo ""
          echo "Creating IPA..."

          cd Payload

          /usr/bin/zip \
            -r \
            -q \
            ../SWISSMARK.ipa \
            SWISSMARK.app

          cd ..

          echo ""
          echo "======================================"
          echo "SWISSMARK IPA CREATED"
          echo "======================================"

          ls -lh SWISSMARK.ipa

          test -f SWISSMARK.ipa


      # =========================================================
      # 11. Upload IPA
      # =========================================================
      - name: Upload SWISSMARK IPA
        uses: actions/upload-artifact@v4
        with:
          name: SWISSMARK-IPA
          path: SWISSMARK_GITHUB_READY/SWISSMARK.ipa
          if-no-files-found: error
