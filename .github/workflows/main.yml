name: Build SWISSMARK iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare project
        shell: bash
        run: |
          set -e

          rm -rf .build_src
          mkdir -p .build_src

          ZIP="$(find . -maxdepth 2 -type f -name '*.zip' | head -n 1)"

          if [ -n "$ZIP" ]; then
            echo "Using ZIP: $ZIP"
            unzip -q "$ZIP" -d .build_src
          fi

          PROJECT="$(find .build_src -name project.yml -print -quit)"

          if [ -z "$PROJECT" ]; then
            echo "ERROR: project.yml not found"
            find . -maxdepth 5 -type f | head -200
            exit 1
          fi

          ROOT="$(dirname "$PROJECT")"
          echo "Project root: $ROOT"

          cp -R "$ROOT"/. .

          test -f project.yml

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS app
        shell: bash
        run: |
          set -e

          SCHEME="$(xcodebuild -list -json | \
            python3 -c '
          import json
          import sys
          data = json.load(sys.stdin)
          print(data["project"]["schemes"][0])
          ')"

          echo "Scheme: $SCHEME"

          xcodebuild \
            -project SWISSMARKiOS.xcodeproj \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package app
        shell: bash
        run: |
          set -e

          APP="$(find \
            build/Build/Products/Release-iphoneos \
            -maxdepth 1 \
            -name '*.app' \
            -print \
            -quit)"

          if [ -z "$APP" ]; then
            echo "ERROR: iOS .app was not created"
            exit 1
          fi

          rm -rf Payload
          rm -f SWISSMARK-iOS-unsigned.zip

          mkdir -p Payload
          cp -R "$APP" Payload/

          zip -qry SWISSMARK-iOS-unsigned.zip Payload

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SWISSMARK-iOS-unsigned
          path: SWISSMARK-iOS-unsigned.zip
          if-no-files-found: error
