name: Build SWISSMARK iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:

      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4


      # 2. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable


      # 3. Extract project
      - name: Extract SWISSMARK project
        run: |
          echo "=============================="
          echo "EXTRACT SWISSMARK PROJECT"
          echo "=============================="

          unzip -o SWISSMARK_GITHUB_READY_FIXED.zip

          echo ""
          echo "=== Repository ==="
          ls -la

          echo ""
          echo "=== SWISSMARK PROJECT ==="
          ls -la SWISSMARK_GITHUB_READY


      # 4. Create fresh iOS project
      - name: Prepare Flutter iOS project
        run: |
          cd SWISSMARK_GITHUB_READY

          echo "=============================="
          echo "FLUTTER VERSION"
          echo "=============================="

          flutter --version

          echo ""
          echo "=============================="
          echo "REMOVE OLD IOS"
          echo "=============================="

          rm -rf ios

          echo ""
          echo "=============================="
          echo "CREATE IOS PROJECT"
          echo "=============================="

          flutter create \
            --platforms=ios \
            --org com.swissmark \
            .

          echo ""
          echo "=== IOS DIRECTORY ==="

          ls -la ios


      # 5. Flutter packages
      - name: Get Flutter packages
        run: |
          cd SWISSMARK_GITHUB_READY

          echo "=============================="
          echo "FLUTTER PUB GET"
          echo "=============================="

          flutter pub get

          echo ""
          echo "=== IOS DIRECTORY AFTER PUB GET ==="

          ls -la ios

          echo ""
          echo "=== PODFILE CHECK ==="

          if [ -f "ios/Podfile" ]; then
            echo "Podfile FOUND"
          else
            echo "No Podfile found."
            echo "Continuing without CocoaPods."
          fi


      # 6. CocoaPods if needed
      - name: Prepare iOS dependencies
        run: |
          cd SWISSMARK_GITHUB_READY

          echo "=============================="
          echo "IOS DEPENDENCIES"
          echo "=============================="

          if [ -f "ios/Podfile" ]; then

            echo "Podfile found."
            echo "Running pod install..."

            cd ios

            pod install --repo-update

            echo ""
            echo "Pods installed successfully."

          else

            echo "No Podfile."
            echo "Skipping CocoaPods."

          fi


      # 7. Generate Flutter iOS configuration
      - name: Generate Flutter iOS configuration
        run: |
          cd SWISSMARK_GITHUB_READY

          echo "=============================="
          echo "GENERATE FLUTTER IOS CONFIG"
          echo "=============================="

          flutter build ios \
            --config-only \
            --release

          echo ""
          echo "Flutter iOS configuration generated."


      # 8. Build directly with Xcode without signing
      - name: Build iOS with Xcode without signing
        run: |
          cd SWISSMARK_GITHUB_READY

          echo "=============================="
          echo "XCODE BUILD WITHOUT SIGNING"
          echo "=============================="

          mkdir -p build/ios

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

          echo ""
          echo "=============================="
          echo "XCODE BUILD FINISHED"
          echo "=============================="


      # 9. Find Runner.app
      - name: Locate iOS app
        run: |
          cd SWISSMARK_GITHUB_READY

          echo "=============================="
          echo "SEARCHING FOR RUNNER.APP"
          echo "=============================="

          find build/ios -name "Runner.app" -type d -print

          APP_PATH=$(find build/ios -name "Runner.app" -type d | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo ""
            echo "ERROR: Runner.app was not found."
            exit 1
          fi

          echo ""
          echo "FOUND:"
          echo "$APP_PATH"

          echo "$APP_PATH" > /tmp/swissmark_app_path


      # 10. Create IPA
      - name: Create unsigned IPA
        run: |
          cd SWISSMARK_GITHUB_READY

          echo "=============================="
          echo "CREATE SWISSMARK IPA"
          echo "=============================="

          APP_PATH=$(cat /tmp/swissmark_app_path)

          echo "Using:"
          echo "$APP_PATH"

          rm -rf Payload
          rm -f SWISSMARK.ipa

          mkdir -p Payload

          cp -R "$APP_PATH" Payload/SWISSMARK.app

          echo ""
          echo "Creating IPA..."

          zip -r -q SWISSMARK.ipa Payload

          echo ""
          echo "=============================="
          echo "SWISSMARK IPA CREATED"
          echo "=============================="

          ls -lh SWISSMARK.ipa


      # 11. Upload IPA
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SWISSMARK-IPA
          path: SWISSMARK_GITHUB_READY/SWISSMARK.ipa
          if-no-files-found: error
