name: Build SWISSMARK iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:

      # =====================================================
      # 1. Checkout
      # =====================================================
      - name: Checkout
        uses: actions/checkout@v4


      # =====================================================
      # 2. Flutter
      # =====================================================
      - name: Setup Flutter 3.47.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true


      # =====================================================
      # 3. Extract project
      # =====================================================
      - name: Extract SWISSMARK project
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "EXTRACTING SWISSMARK PROJECT"
          echo "========================================"

          test -f "SWISSMARK_GITHUB_READY_FIXED.zip"

          rm -rf SWISSMARK_GITHUB_READY

          unzip -q -o "SWISSMARK_GITHUB_READY_FIXED.zip"

          echo ""
          echo "Checking extracted project..."

          test -d "SWISSMARK_GITHUB_READY"
          test -f "SWISSMARK_GITHUB_READY/pubspec.yaml"
          test -f "SWISSMARK_GITHUB_READY/lib/main.dart"

          echo ""
          echo "SWISSMARK PROJECT FOUND SUCCESSFULLY"

          echo ""
          echo "Project contents:"
          ls -la SWISSMARK_GITHUB_READY


      # =====================================================
      # 4. Verify Flutter project
      # =====================================================
      - name: Verify Flutter project
        shell: bash
        working-directory: SWISSMARK_GITHUB_READY
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFY FLUTTER PROJECT"
          echo "========================================"

          test -f pubspec.yaml
          test -f lib/main.dart

          echo "pubspec.yaml FOUND"
          echo "main.dart FOUND"

          echo ""
          echo "Flutter version:"
          flutter --version


      # =====================================================
      # 5. Create fresh iOS project
      # =====================================================
      - name: Create iOS project
        shell: bash
        working-directory: SWISSMARK_GITHUB_READY
        run: |
          set -euo pipefail

          echo "========================================"
          echo "CREATE IOS PROJECT"
          echo "========================================"

          rm -rf ios

          flutter config --enable-swift-package-manager

          flutter create \
            --platforms=ios \
            --org com.swissmark \
            --project-name swissmark \
            .

          test -d ios
          test -f ios/Runner.xcodeproj/project.pbxproj
          test -f ios/Runner.xcworkspace/contents.xcworkspacedata

          echo ""
          echo "IOS PROJECT CREATED SUCCESSFULLY"


      # =====================================================
      # 6. Flutter dependencies
      # =====================================================
      - name: Get Flutter packages
        shell: bash
        working-directory: SWISSMARK_GITHUB_READY
        run: |
          set -euo pipefail

          echo "========================================"
          echo "FLUTTER PUB GET"
          echo "========================================"

          flutter clean
          flutter pub get

          test -f pubspec.yaml
          test -f ios/Flutter/Generated.xcconfig

          echo ""
          echo "FLUTTER PACKAGES READY"


      # =====================================================
      # 7. Configure iOS permissions
      # =====================================================
      - name: Configure iOS permissions
        shell: bash
        working-directory: SWISSMARK_GITHUB_READY
        run: |
          set -euo pipefail

          echo "========================================"
          echo "CONFIGURE IOS PERMISSIONS"
          echo "========================================"

          PLIST="ios/Runner/Info.plist"

          test -f "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :NSLocationWhenInUseUsageDescription string SWISS MARK needs your location to save customer location." \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string SWISS MARK needs your location to save customer location." \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :NSPhotoLibraryUsageDescription string SWISS MARK needs photo access for maintenance orders." \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :NSCameraUsageDescription string SWISS MARK needs camera access for maintenance orders." \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :NSMicrophoneUsageDescription string SWISS MARK needs microphone access for videos." \
            "$PLIST" 2>/dev/null || true

          echo "IOS PERMISSIONS READY"


      # =====================================================
      # 8. Generate iOS configuration
      # =====================================================
      - name: Generate iOS configuration without signing
        shell: bash
        working-directory: SWISSMARK_GITHUB_READY
        run: |
          set -euo pipefail

          echo "========================================"
          echo "GENERATE IOS CONFIGURATION"
          echo "========================================"

          flutter build ios \
            --release \
            --config-only \
            --no-codesign

          echo ""
          echo "IOS CONFIGURATION READY"


      # =====================================================
      # 9. Build Flutter bundle
      # =====================================================
      - name: Build Flutter bundle
        shell: bash
        working-directory: SWISSMARK_GITHUB_READY
        run: |
          set -euo pipefail

          echo "========================================"
          echo "BUILD FLUTTER BUNDLE"
          echo "========================================"

          test -f pubspec.yaml

          flutter build bundle --release

          echo ""
          echo "FLUTTER BUNDLE CREATED"


      # =====================================================
      # 10. Build iOS with Xcode without signing
      # =====================================================
      - name: Build iOS with Xcode without signing
        shell: bash
        working-directory: SWISSMARK_GITHUB_READY
        run: |
          set -euo pipefail

          echo "========================================"
          echo "XCODE BUILD WITHOUT SIGNING"
          echo "========================================"

          rm -rf build/xcode

          mkdir -p build/xcode

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/xcode \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

          echo ""
          echo "========================================"
          echo "XCODE BUILD SUCCESSFUL"
          echo "========================================"


      # =====================================================
      # 11. Verify Runner.app
      # =====================================================
      - name: Verify iOS app
        shell: bash
        working-directory: SWISSMARK_GITHUB_READY
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFY RUNNER APP"
          echo "========================================"

          APP_PATH="build/xcode/Build/Products/Release-iphoneos/Runner.app"

          if [ ! -d "$APP_PATH" ]; then
            echo ""
            echo "ERROR: Runner.app NOT FOUND"
            echo ""
            echo "Searching..."
            find build/xcode \
              -type d \
              -name "Runner.app" \
              -print || true

            exit 1
          fi

          echo ""
          echo "RUNNER.APP FOUND"
          echo "$APP_PATH"


      # =====================================================
      # 12. Create IPA
      # =====================================================
      - name: Create IPA
        shell: bash
        working-directory: SWISSMARK_GITHUB_READY
        run: |
          set -euo pipefail

          echo "========================================"
          echo "CREATE SWISSMARK IPA"
          echo "========================================"

          APP_PATH="build/xcode/Build/Products/Release-iphoneos/Runner.app"

          test -d "$APP_PATH"

          rm -rf Payload
          rm -f SWISSMARK.ipa

          mkdir -p Payload

          cp -R \
            "$APP_PATH" \
            Payload/SWISSMARK.app

          /usr/bin/zip \
            -q \
            -r \
            SWISSMARK.ipa \
            Payload/SWISSMARK.app

          test -s SWISSMARK.ipa

          echo ""
          echo "Checking IPA..."

          unzip -tq SWISSMARK.ipa

          echo ""
          echo "========================================"
          echo "SWISSMARK IPA CREATED"
          echo "========================================"

          ls -lh SWISSMARK.ipa


      # =====================================================
      # 13. Upload IPA
      # =====================================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SWISSMARK-IPA
          path: SWISSMARK_GITHUB_READY/SWISSMARK.ipa
          if-no-files-found: error
