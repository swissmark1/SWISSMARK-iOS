name: Build SWISSMARK iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare project
        shell: bash
        run: |
          set -e

          ZIP="$(find . -maxdepth 2 -type f \( \
            -name 'SWISSMARK_iOS_GITHUB_READY.zip' -o \
            -name 'SWISSMARK_iOS_FULL_V13.zip' \
          \) | head -n 1)"

          if [ -n "$ZIP" ]; then
            mkdir -p .build_src
            unzip -q "$ZIP" -d .build_src

            ROOT="$(find .build_src -name project.yml -print -quit | xargs dirname)"

            cp -R "$ROOT"/. .
          fi

          test -f project.yml

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS app
        run: |
          set -e

          SCHEME="$(xcodebuild -list -json | \
            python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["project"]["schemes"][0])')"

          xcodebuild \
            -project SWISSMARKiOS.xcodeproj \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package app
        run: |
          set -e

          APP="$(find build/Build/Products/Release-iphoneos \
            -maxdepth 1 \
            -name '*.app' \
            -print -quit)"

          test -n "$APP"

          mkdir -p Payload
          cp -R "$APP" Payload/

          zip -qry SWISSMARK-iOS-unsigned.zip Payload

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SWISSMARK-iOS-unsigned
          path: SWISSMARK-iOS-unsigned.zip
