name: Build SWISSMARK iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract SWISSMARK iOS project
        shell: bash
        run: |
          set -e

          if [ -f "SWISSMARK_iOS_V6.zip" ]; then
            mkdir -p ios_source
            unzip -q "SWISSMARK_iOS_V6.zip" -d ios_source
          elif [ -f "SWISSMARK_iOS_V5.zip" ]; then
            mkdir -p ios_source
            unzip -q "SWISSMARK_iOS_V5.zip" -d ios_source
          fi

          PROJECT_FILE=$(find . -name project.yml -type f | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.yml not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project at: $PROJECT_DIR"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          xcodegen generate --spec project.yml

      - name: Build SWISSMARK iOS
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          xcodebuild \
            -project SWISSMARKiOS.xcodeproj \
            -scheme SWISSMARKiOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          mkdir -p Payload

          cp -R \
            build/Build/Products/Release-iphoneos/SWISSMARKiOS.app \
            Payload/SWISSMARK.app

          zip -qry SWISSMARK.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SWISSMARK-iOS-IPA
          path: ${{ env.PROJECT_DIR }}/SWISSMARK.ipa
