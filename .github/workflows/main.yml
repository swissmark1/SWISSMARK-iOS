name: Build SWISSMARK iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract SWISSMARK project
        run: |
          unzip -o SWISSMARK_GITHUB_READY.zip
          cd SWISSMARK_GITHUB_READY
          flutter create --platforms=ios .

      - name: Get Flutter packages
        run: |
          cd SWISSMARK_GITHUB_READY
          flutter pub get

      - name: Prepare iOS project
        run: |
          cd SWISSMARK_GITHUB_READY
          flutter build ios --release --config-only

      - name: Install CocoaPods
        run: |
          cd SWISSMARK_GITHUB_READY/ios
          pod install --repo-update

      - name: Build iOS app without signing
        run: |
          cd SWISSMARK_GITHUB_READY

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/xcodebuild \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Create unsigned IPA
        run: |
          cd SWISSMARK_GITHUB_READY

          rm -rf Payload
          mkdir Payload

          cp -R \
            build/ios/xcodebuild/Build/Products/Release-iphoneos/Runner.app \
            Payload/SWISSMARK.app

          zip -r SWISSMARK.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SWISSMARK-IPA
          path: SWISSMARK_GITHUB_READY/SWISSMARK.ipa
          if-no-files-found: error
