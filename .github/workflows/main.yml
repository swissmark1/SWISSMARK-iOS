name: Build SWISSMARK iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract latest SWISSMARK iOS project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'SWISSMARK_iOS_*.zip' | sort -V | tail -n 1)

          if [ -z "${ZIP_FILE}" ]; then
            echo "ERROR: No SWISSMARK_iOS_*.zip found in repository root."
            exit 1
          fi

          echo "Using ${ZIP_FILE}"

          rm -rf ios_source
          mkdir -p ios_source

          unzip -q "${ZIP_FILE}" -d ios_source

          PROJECT_FILE=$(find ios_source -name project.yml -type f | head -n 1)

          if [ -z "${PROJECT_FILE}" ]; then
            echo "ERROR: project.yml not found inside ${ZIP_FILE}"
            exit 1
          fi

          PROJECT_DIR=$(dirname "${PROJECT_FILE}")

          echo "PROJECT_DIR=${PROJECT_DIR}" >> "$GITHUB_ENV"

          echo "Found project at ${PROJECT_DIR}"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          xcodegen generate --spec project.yml

      - name: Build SWISSMARK iOS
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          xcodebuild \
            -project SWISSMARKiOS.xcodeproj \
            -scheme SWISSMARKiOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          rm -rf Payload SWISSMARK.ipa

          mkdir -p Payload

          cp -R \
            build/Build/Products/Release-iphoneos/SWISSMARKiOS.app \
            Payload/SWISSMARK.app

          zip -qry SWISSMARK.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SWISSMARK-iOS-IPA
          path: ${{ env.PROJECT_DIR }}/SWISSMARK.ipa
