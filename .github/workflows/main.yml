name: Build SWISSMARK iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract SWISSMARK project
        run: |
          unzip -o SWISSMARK_GITHUB_READY.zip
          cd SWISSMARK_GITHUB_READY
          flutter create --platforms=ios .

      - name: Get Flutter packages
        run: |
          cd SWISSMARK_GITHUB_READY
          flutter pub get

      - name: Build iOS app without signing
        run: |
          cd SWISSMARK_GITHUB_READY
          flutter build ios --release --no-codesign

      - name: Create unsigned IPA
        run: |
          cd SWISSMARK_GITHUB_READY
          rm -rf Payload
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/SWISSMARK.app
          zip -r SWISSMARK.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SWISSMARK-IPA
          path: SWISSMARK_GITHUB_READY/SWISSMARK.ipa
