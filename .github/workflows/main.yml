name: Build SWISSMARK iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build SWISSMARK iOS
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SWISSMARK source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'SWISSMARK_iOS_SOURCE_PORT_*.zip' -print | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: SWISSMARK iOS source ZIP was not found."
            exit 1
          fi

          rm -rf _ios_source SWISSMARKiOS SWISSMARKiOS.xcodeproj
          rm -f project.yml
          mkdir -p _ios_source

          unzip -q "$ZIP_FILE" -d _ios_source

          test -f "_ios_source/project.yml"
          test -d "_ios_source/SWISSMARKiOS"
          test -f "_ios_source/SWISSMARKiOS/SWISSMARKiOSApp.swift"

          cp "_ios_source/project.yml" project.yml
          cp -R "_ios_source/SWISSMARKiOS" SWISSMARKiOS

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate
          test -d SWISSMARKiOS.xcodeproj

      - name: Xcode information
        run: |
          xcodebuild -version
          xcodegen --version

      - name: Clean
        run: |
          xcodebuild clean \
            -project SWISSMARKiOS.xcodeproj \
            -scheme SWISSMARKiOS \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build iOS app
        shell: bash
        run: |
          set -o pipefail

          rm -rf build

          xcodebuild \
            -project SWISSMARKiOS.xcodeproj \
            -scheme SWISSMARKiOS \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | tee build.log

      - name: Verify iOS app
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(find build -type d -name 'SWISSMARKiOS.app' -print -quit)"

          test -n "$APP_PATH"
          test -f "$APP_PATH/SWISSMARKiOS"

          echo "APP FOUND: $APP_PATH"
          file "$APP_PATH/SWISSMARKiOS"
          du -sh "$APP_PATH"

      - name: Create IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(find build -type d -name 'SWISSMARKiOS.app' -print -quit)"

          rm -rf Payload
          rm -f SWISSMARK-iOS.ipa

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/SWISSMARKiOS.app

          cd Payload
          zip -r -q ../SWISSMARK-iOS.ipa SWISSMARKiOS.app
          cd ..

          ls -lh SWISSMARK-iOS.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SWISSMARK-iOS
          path: SWISSMARK-iOS.ipa
          if-no-files-found: error
          overwrite: true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SWISSMARK-build-log
          path: build.log
          if-no-files-found: ignore
          overwrite: true
