name: Build SWISSMARK iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      - name: Generate iOS project
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "CREATE IOS PROJECT"
          echo "======================================"

          rm -rf ios

          flutter config --enable-swift-package-manager

          flutter create \
            --platforms=ios \
            --org com.swissmark \
            --project-name swissmark \
            .

          test -f ios/Runner.xcodeproj/project.pbxproj

          echo "iOS project created successfully."


      - name: Resolve Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "FLUTTER PUB GET"
          echo "======================================"

          flutter pub get

          echo ""
          echo "======================================"
          echo "CHECK FLUTTER CONFIGURATION"
          echo "======================================"

          test -f .flutter-plugins-dependencies
          test -f ios/Flutter/Generated.xcconfig

          echo ""
          echo "======================================"
          echo "CHECK SWIFT PACKAGE MANAGER"
          echo "======================================"

          test -d \
            ios/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage

          grep -q \
            "FlutterGeneratedPluginSwiftPackage" \
            ios/Runner.xcodeproj/project.pbxproj

          echo ""
          echo "Swift Package Manager integration FOUND."


      - name: Build Flutter bundle
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "BUILD FLUTTER BUNDLE"
          echo "======================================"

          flutter build bundle --release

          echo ""
          echo "Flutter bundle created successfully."


      - name: Build iOS with Xcode without signing
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "XCODE BUILD WITHOUT SIGNING"
          echo "======================================"

          xcodebuild \
            -project ios/Runner.xcodeproj \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/xcode \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            build

          echo ""
          echo "======================================"
          echo "XCODE BUILD SUCCESSFUL"
          echo "======================================"


      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "CREATE IPA"
          echo "======================================"

          APP_PATH="build/xcode/Build/Products/Release-iphoneos/Runner.app"

          test -d "$APP_PATH"

          rm -rf Payload
          rm -f SWISSMARK.ipa

          mkdir Payload

          cp -R \
            "$APP_PATH" \
            Payload/SWISSMARK.app

          cd Payload

          /usr/bin/zip \
            -r \
            -q \
            ../SWISSMARK.ipa \
            SWISSMARK.app

          cd ..

          test -s SWISSMARK.ipa

          echo ""
          echo "======================================"
          echo "VERIFY IPA"
          echo "======================================"

          unzip -tq SWISSMARK.ipa

          echo ""
          echo "IPA CREATED SUCCESSFULLY:"
          ls -lh SWISSMARK.ipa


      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SWISSMARK-IPA
          path: SWISSMARK.ipa
          if-no-files-found: error
