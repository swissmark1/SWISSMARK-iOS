name: Build SWISSMARK iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build SWISSMARK iOS
    runs-on: macos-15

    steps:

      # 1. تحميل المشروع
      - name: Checkout
        uses: actions/checkout@v4

      # 2. التأكد من ملفات المشروع
      - name: Check project files
        run: |
          echo "=== Repository ==="
          pwd
          echo "=== Files ==="
          find . -maxdepth 3 -type f | sort | head -300

      # 3. تثبيت XcodeGen
      - name: Install XcodeGen
        run: |
          brew update
          brew install xcodegen

      # 4. إنشاء Xcode project من project.yml
      - name: Generate Xcode project
        run: |
          xcodegen generate

      # 5. عرض معلومات Xcode
      - name: Xcode information
        run: |
          xcodebuild -version
          xcodegen --version

      # 6. تنظيف المشروع
      - name: Clean
        run: |
          xcodebuild clean \
            -project SWISSMARKiOS.xcodeproj \
            -scheme SWISSMARKiOS \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      # 7. بناء نسخة iOS بدون توقيع Apple
      - name: Build iOS app
        run: |
          set -o pipefail

          xcodebuild \
            -project SWISSMARKiOS.xcodeproj \
            -scheme SWISSMARKiOS \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | tee build.log

      # 8. فحص ملف التطبيق
      - name: Verify app
        run: |
          echo "=== Built files ==="
          find build -maxdepth 6 -type d -name "*.app" -print

          APP_PATH=$(find build -maxdepth 6 -type d -name "SWISSMARKiOS.app" | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: SWISSMARKiOS.app was not created"
            exit 1
          fi

          echo "APP FOUND:"
          echo "$APP_PATH"

          echo "=== App executable ==="
          ls -lh "$APP_PATH/SWISSMARKiOS"

          file "$APP_PATH/SWISSMARKiOS"

      # 9. تجهيز Payload
      - name: Create IPA
        run: |
          APP_PATH=$(find build -maxdepth 6 -type d -name "SWISSMARKiOS.app" | head -1)

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP_PATH" Payload/SWISSMARKiOS.app

          rm -f SWISSMARK-iOS.ipa

          zip -r -q SWISSMARK-iOS.ipa Payload

          echo "=== IPA ==="
          ls -lh SWISSMARK-iOS.ipa

      # 10. رفع IPA
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SWISSMARK-iOS
          path: SWISSMARK-iOS.ipa
          if-no-files-found: error

      # 11. رفع سجل البناء إذا فشل
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SWISSMARK-build-log
          path: build.log
          if-no-files-found: ignore
