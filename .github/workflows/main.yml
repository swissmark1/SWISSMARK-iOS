name: Build SWISSMARK iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Flutter 3.47.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true


      - name: Extract SWISSMARK project
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "FINDING SWISSMARK V51 PROJECT"
          echo "======================================"

          shopt -s nullglob

          zips=(SWISSMARK_V51_IOS*.zip)

          if [ "${#zips[@]}" -eq 0 ]; then
            echo "ERROR: No SWISSMARK_V51_IOS*.zip found."
            echo ""
            echo "Repository files:"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "${zips[0]}"

          rm -rf swissmark_project

          mkdir -p swissmark_project

          unzip -q "${zips[0]}" -d swissmark_project

          PROJECT_DIR="$(
            find swissmark_project \
              -name pubspec.yaml \
              -type f \
              -print \
              -quit |
              xargs -r dirname
          )"

          if [ -z "${PROJECT_DIR}" ]; then
            echo "ERROR: pubspec.yaml was not found."
            echo ""
            echo "Extracted files:"
            find swissmark_project -maxdepth 5 -print
            exit 1
          fi

          echo "PROJECT_DIR=${PROJECT_DIR}" >> "$GITHUB_ENV"

          echo ""
          echo "FLUTTER PROJECT:"
          echo "${PROJECT_DIR}"

          test -f "${PROJECT_DIR}/pubspec.yaml"
          test -f "${PROJECT_DIR}/lib/main.dart"

          echo ""
          echo "PROJECT FILES VERIFIED."


      - name: Verify Flutter project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "VERIFY FLUTTER PROJECT"
          echo "======================================"

          flutter --version

          echo ""
          echo "Running flutter pub get..."

          flutter pub get

          echo ""
          echo "Running flutter analyze..."

          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings

          echo ""
          echo "FLUTTER PROJECT VERIFIED."


      - name: Create iOS project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "CREATE iOS PROJECT"
          echo "======================================"

          flutter create \
            --platforms=ios \
            .

          echo ""
          echo "iOS PROJECT CREATED."


      - name: Install Xcode project helper
        run: |
          set -e

          echo "======================================"
          echo "INSTALL XCODE PROJECT HELPER"
          echo "======================================"

          gem install xcodeproj --no-document

          echo "xcodeproj installed successfully."


      - name: Install GoogleService-Info.plist
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "INSTALL FIREBASE IOS CONFIGURATION"
          echo "======================================"

          if [ ! -f "${GITHUB_WORKSPACE}/GoogleService-Info.plist" ]; then
            echo "ERROR: GoogleService-Info.plist was not found."
            echo ""
            echo "Upload GoogleService-Info.plist to the root of the GitHub repository."
            exit 1
          fi

          cp \
            "${GITHUB_WORKSPACE}/GoogleService-Info.plist" \
            "ios/Runner/GoogleService-Info.plist"

          test -f "ios/Runner/GoogleService-Info.plist"

          echo "GoogleService-Info.plist copied successfully."


      - name: Add Firebase plist to Xcode resources
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "ADD FIREBASE PLIST TO XCODE TARGET"
          echo "======================================"

          export PROJECT_DIR_ABS="$(pwd)"

          ruby <<'RUBY'
          require "xcodeproj"

          project_dir = ENV["PROJECT_DIR_ABS"]

          project_path = File.join(
            project_dir,
            "ios",
            "Runner.xcodeproj"
          )

          plist_path = File.join(
            project_dir,
            "ios",
            "Runner",
            "GoogleService-Info.plist"
          )

          unless File.exist?(project_path)
            abort("ERROR: Runner.xcodeproj was not found.")
          end

          unless File.exist?(plist_path)
            abort("ERROR: GoogleService-Info.plist was not found.")
          end

          project = Xcodeproj::Project.open(project_path)

          target = project.targets.find do |t|
            t.name == "Runner"
          end

          unless target
            abort("ERROR: Runner target was not found.")
          end

          group = project.main_group
            .groups
            .find { |g| g.path.to_s == "Runner" }

          unless group
            group = project.main_group.new_group(
              "Runner",
              "Runner"
            )
          end

          existing_file = group.files.find do |f|
            f.path.to_s == "GoogleService-Info.plist"
          end

          unless existing_file
            file_ref = group.new_file(
              "GoogleService-Info.plist"
            )

            resources_phase = target.resources_build_phase

            resources_phase.add_file_reference(
              file_ref
            )

            puts "GoogleService-Info.plist added to Runner resources."
          else
            puts "GoogleService-Info.plist already exists in Runner resources."
          end

          project.save

          puts "Xcode project updated successfully."
          RUBY

          echo ""
          echo "Firebase plist added to Xcode resources."


      - name: Get Flutter packages
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "GET FLUTTER PACKAGES"
          echo "======================================"

          flutter pub get

          echo ""
          echo "PACKAGES READY."


      - name: Configure iOS permissions
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "CONFIGURE IOS PERMISSIONS"
          echo "======================================"

          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          plist = Path("ios/Runner/Info.plist")

          if not plist.exists():
              raise SystemExit(
                  "ERROR: ios/Runner/Info.plist not found"
              )

          content = plist.read_text()

          permissions = [
              (
                  "<key>NSLocationWhenInUseUsageDescription</key>",
                  "<key>NSLocationWhenInUseUsageDescription</key>"
                  "<string>SWISSMARK يحتاج الموقع لعرض موقع الزبون.</string>"
              ),
              (
                  "<key>NSPhotoLibraryUsageDescription</key>",
                  "<key>NSPhotoLibraryUsageDescription</key>"
                  "<string>SWISSMARK يحتاج الصور لإرفاقها بالأوردرات.</string>"
              ),
              (
                  "<key>NSCameraUsageDescription</key>",
                  "<key>NSCameraUsageDescription</key>"
                  "<string>SWISSMARK يحتاج الكاميرا لإضافة صور للأوردر.</string>"
              ),
              (
                  "<key>NSMicrophoneUsageDescription</key>",
                  "<key>NSMicrophoneUsageDescription</key>"
                  "<string>SWISSMARK يحتاج المايك لبعض وظائف الوسائط.</string>"
              ),
          ]

          for key, block in permissions:
              if key not in content:
                  content = content.replace(
                      "</dict>",
                      "    " + block + "\n</dict>",
                      1
                  )

          plist.write_text(content)

          print("iOS permissions configured successfully.")
          PY


      - name: Verify Firebase configuration
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "VERIFY FIREBASE CONFIGURATION"
          echo "======================================"

          if [ ! -f "ios/Runner/GoogleService-Info.plist" ]; then
            echo "ERROR: Firebase plist missing."
            exit 1
          fi

          echo ""
          echo "Firebase App ID:"

          /usr/libexec/PlistBuddy \
            -c "Print :GOOGLE_APP_ID" \
            ios/Runner/GoogleService-Info.plist

          echo ""
          echo "Firebase Project ID:"

          /usr/libexec/PlistBuddy \
            -c "Print :PROJECT_ID" \
            ios/Runner/GoogleService-Info.plist

          echo ""
          echo "Firebase configuration verified."


      - name: Generate iOS configuration without signing
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "BUILD IOS WITHOUT SIGNING"
          echo "======================================"

          flutter build ios \
            --release \
            --no-codesign

          echo ""
          echo "iOS BUILD COMPLETED."


      - name: Verify iOS app
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "VERIFY IOS APP"
          echo "======================================"

          if [ ! -d "build/ios/iphoneos/Runner.app" ]; then
            echo "ERROR: Runner.app was not created."
            exit 1
          fi

          echo "Runner.app FOUND."

          echo ""
          echo "Bundle identifier:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            build/ios/iphoneos/Runner.app/Info.plist

          echo ""
          echo "Checking Firebase plist inside final app..."

          if [ ! -f \
            "build/ios/iphoneos/Runner.app/GoogleService-Info.plist"
          ]; then
            echo "ERROR: GoogleService-Info.plist is NOT inside Runner.app."
            exit 1
          fi

          echo "GoogleService-Info.plist FOUND inside Runner.app."

          echo ""
          echo "iOS APP VERIFIED."


      - name: Create IPA
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "CREATE IPA"
          echo "======================================"

          rm -rf ipa_out

          mkdir -p ipa_out/Payload

          cp -R \
            build/ios/iphoneos/Runner.app \
            ipa_out/Payload/SWISSMARK.app

          cd ipa_out

          zip -qr \
            ../SWISSMARK.ipa \
            Payload

          cd ..

          if [ ! -f "SWISSMARK.ipa" ]; then
            echo "ERROR: SWISSMARK.ipa was not created."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "IPA CREATED SUCCESSFULLY"
          echo "======================================"

          ls -lh SWISSMARK.ipa


      - name: Verify IPA archive
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "VERIFY IPA"
          echo "======================================"

          unzip -t SWISSMARK.ipa

          echo ""
          echo "Checking Firebase plist in IPA..."

          unzip -l SWISSMARK.ipa | grep \
            "Payload/SWISSMARK.app/GoogleService-Info.plist"

          echo ""
          echo "IPA ARCHIVE VERIFIED."


      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SWISSMARK-iOS-IPA
          path: ${{ env.PROJECT_DIR }}/SWISSMARK.ipa
          if-no-files-found: error
