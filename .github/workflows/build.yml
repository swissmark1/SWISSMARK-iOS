name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install xcodegen ldid
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          set +e
          xcodebuild -project SwissMark.xcodeproj -scheme SwissMark \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "=== ERRORS ==="
            grep -E "error:" build.log | sort -u | head -15
            exit $code
          fi
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/SwissMark.app Payload/
          ls Payload/SwissMark.app
          test -f Payload/SwissMark.app/GoogleService-Info.plist
          cat > ent.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>application-identifier</key>
            <string>com.swissmark</string>
            <key>keychain-access-groups</key>
            <array><string>com.swissmark</string></array>
          </dict>
          </plist>
          PLIST
          ldid -Sent.plist Payload/SwissMark.app/SwissMark
          zip -r SwissMark.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SwissMark-ipa
          path: SwissMark.ipa
