name: SWISSMARKiOS

options:
  bundleIdPrefix: com.swissmark
  deploymentTarget:
    iOS: "17.0"

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 11.0.0

targets:
  SWISSMARKiOS:
    type: application
    platform: iOS

    sources:
      - SWISSMARKiOS

    dependencies:
      - package: Firebase
        product: FirebaseCore

    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.swissmark.ios
      SWIFT_VERSION: 5.0
      INFOPLIST_FILE: SWISSMARKiOS/Info.plist
      TARGETED_DEVICE_FAMILY: "1,2"
      SWIFT_EMIT_LOC_STRINGS: YES

    scheme:
      gatherCoverageData: false
